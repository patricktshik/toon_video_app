name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Générer le dossier android
        run: flutter create . --platforms=android --project-name toon_video_app

      - name: Ajouter la permission Internet
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Compiler l'APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: toon-video-apk
          path: build/app/outputs/flutter-apk/app-release.apk
